name: Jules Codebase Sweep

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Run check_gh_jules.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python check_gh_jules.py
